---
# Distribution-aware internal variables for the logrotate role.
_logrotate_packages:
  default:
    - logrotate

logrotate_packages: >-
  {{
    _logrotate_packages[ansible_facts['distribution'] ~ '-' ~ ansible_facts['distribution_major_version']]
    | default(
        _logrotate_packages[ansible_facts['distribution']]
        | default(_logrotate_packages['default'])
      )
  }}

_logrotate_conf:
  default: /etc/logrotate.conf

logrotate_conf: >-
  {{
    _logrotate_conf[ansible_facts['distribution'] ~ '-' ~ ansible_facts['distribution_major_version']]
    | default(
        _logrotate_conf[ansible_facts['distribution']]
        | default(_logrotate_conf['default'])
      )
  }}

_logrotated_path:
  default: /etc/logrotate.d

logrotated_path: >-
  {{
    _logrotated_path[ansible_facts['distribution'] ~ '-' ~ ansible_facts['distribution_major_version']]
    | default(
        _logrotated_path[ansible_facts['distribution']]
        | default(_logrotated_path['default'])
      )
  }}
