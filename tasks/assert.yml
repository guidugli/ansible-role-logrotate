---
- name: Assert that variables have valid values
  ansible.builtin.assert:
    that:
      - logrotate_compress is boolean
      - logrotate_use_date_extension is boolean
      - logrotate_weeks2keep is integer
      - logrotate_weeks2keep | int > 0
      - logrotate_config_files is sequence
      - logrotate_config_files is not string
    quiet: true
  tags:
    - logrotate
    - validate
