---
- name: Configure rotate retention
  ansible.builtin.lineinfile:
    path: "{{ logrotate_conf }}"
    regexp: '^rotate\s+\d+'
    line: "rotate {{ logrotate_weeks2keep }}"
    state: present
  tags:
    - logrotate
    - config

- name: Configure date extension behavior
  ansible.builtin.lineinfile:
    path: "{{ logrotate_conf }}"
    regexp: '^#?dateext\s*$'
    line: "{{ 'dateext' if logrotate_use_date_extension else '#dateext' }}"
    state: present
  tags:
    - logrotate
    - config

- name: Configure compression behavior
  ansible.builtin.lineinfile:
    path: "{{ logrotate_conf }}"
    regexp: '^#?compress\s*$'
    line: "{{ 'compress' if logrotate_compress else '#compress' }}"
    state: present
  tags:
    - logrotate
    - config

- name: Copy additional logrotate snippets
  ansible.builtin.copy:
    src: "{{ ansible_facts['os_family'] }}/{{ item }}"
    dest: "{{ logrotated_path }}/{{ item }}"
    owner: root
    group: root
    mode: '0640'
  loop: "{{ logrotate_config_files }}"
  when: logrotate_config_files | length > 0
  tags:
    - logrotate
    - config
